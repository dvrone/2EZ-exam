<!DOCTYPE html>
<html lang="uz">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            {% block title %}Xush kelibsiz!{% endblock %}
        | 2EZ</title>
        <!-- Flash oldini olish: DOM render bo'lishidan OLDIN theme o'rnatiladi -->
        <script>
      (function () {
        var t = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-bs-theme", t);
      })();
        </script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
              rel="stylesheet" />
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/main.css') }}" />
    </head>
    <body>
        {% include "partials/navbar.html" %}
        <div class="container mt-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
            {% endwith %}
            {% block content %}{% endblock %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{{ url_for('static', filename='js/form-validation.js') }}"></script>
        <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
        <script src="{{ url_for('static', filename='js/greeting.js') }}"></script>
        {% block scripts %}{% endblock %}
    </body>
</html>
