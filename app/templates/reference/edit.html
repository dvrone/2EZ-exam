{% extends 'base.html' %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-7">
            <h4 class="mb-4 fw-bold">
                <i class="bi bi-pencil"></i> Ma'lumotnomani tahrirlash
            </h4>
            <div class="card p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Sarlavha</label>
                        <input type="text"
                               name="title"
                               class="form-control"
                               value="{{ reference.title }}"
                               required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Kontent</label>
                        <textarea name="content" class="form-control" rows="12" required>{{ reference.content }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-save"></i> Saqlash
                        </button>
                        <a href="{{ url_for('reference.detail_reference', ref_id=reference.id) }}"
                           class="btn btn-outline-secondary w-100">
                            <i class="bi bi-x-lg"></i> Bekor qilish
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
