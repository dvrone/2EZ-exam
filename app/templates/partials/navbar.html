<nav class="navbar px-4 py-3" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for("auth.index") }}">2EZ</a>
        <div class="d-flex align-items-center gap-3">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for("auth.index") }}"
                   class="btn btn-outline-light btn-sm {% if request.endpoint == 'auth.index' %}active{% endif %}"
                   data-bs-toggle="tooltip"
                   title="Bosh sahifa">
                    <i class="bi bi-house-fill"></i>
                </a>
                <a href="{{ url_for("auth.leaderboard") }}"
                   class="btn btn-outline-light btn-sm {% if request.endpoint == 'auth.leaderboard' %}active{% endif %}"
                   data-bs-toggle="tooltip"
                   title="Leaderboard">
                    <i class="bi bi-trophy-fill"></i>
                </a>
            {% endif %}
            <button id="themeToggle"
                    class="btn btn-outline-light btn-sm"
                    data-bs-toggle="tooltip"
                    title="Mavzuni o'zgartirish">
                <i class="bi bi-moon-fill"></i>
            </button>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for("auth.profile") }}"
                   class="btn btn-outline-light btn-sm {% if request.endpoint == 'auth.profile' %}active{% endif %}"
                   data-bs-toggle="tooltip"
                   title="{{ current_user.username }}">
                    <i class="bi bi-person-circle"></i>
                </a>
                <a href="{{ url_for("auth.settings") }}"
                   class="btn btn-outline-light btn-sm {% if request.endpoint == 'auth.settings' %}active{% endif %}"
                   data-bs-toggle="tooltip"
                   title="Sozlamalar">
                    <i class="bi bi-gear-fill"></i>
                </a>
                <a href="{{ url_for("auth.logout") }}"
                   class="btn btn-outline-light btn-sm"
                   data-bs-toggle="tooltip"
                   title="Chiqish">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            {% else %}
                <a href="{{ url_for("auth.login") }}"
                   class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-in-right"></i> Kirish
                </a>
                <a href="{{ url_for("auth.register") }}" class="btn btn-light btn-sm">
                    <i class="bi bi-person-plus"></i> Ro'yxatdan o'tish
                </a>
            {% endif %}
        </div>
    </div>
</nav>
