{% extends 'base.html' %}
{% block title %}Yangi test{% endblock %}
{% block content %}
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0">
      <i class="bi bi-plus-circle text-primary"></i> Yangi test yaratish
    </h3>
  </div>
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Test nomi</label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Tavsif</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Davomiyligi (daqiqada)</label>
            <input type="number" name="duration" class="form-control" value="30" min="5">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">
              Savollar soni
              <span class="text-muted fw-normal">(ixtiyoriy)</span>
            </label>
            <input type="number"
                   name="question_count"
                   class="form-control"
                   min="1"
                   placeholder="Bo'sh qolsa — hammasi">
            <div class="form-text text-muted">
              <i class="bi bi-info-circle"></i>
              Masalan 100 ta savoldan 30 tasini olish uchun 30 kiriting.
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
              Yaratish <i class="bi bi-arrow-right"></i>
            </button>
            <a href="{{ url_for("exam.list_exams") }}" class="btn btn-outline-secondary w-100">
              <i class="bi bi-x-lg"></i> Bekor qilish
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="mb-5"></div>
{% endblock %}
