{% extends 'base.html' %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h4 class="mb-4 fw-bold">Yangi test yaratish</h4>
            <div class="card p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Test nomi</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tavsif</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Davomiyligi (daqiqada)</label>
                        <input type="number" name="duration" class="form-control" value="30" min="5">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Yaratish →</button>
                        <a href="{{ url_for("exam.list_exams") }}"
                           class="btn btn-outline-secondary w-100">Bekor qilish</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
