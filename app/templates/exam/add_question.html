{% extends 'base.html' %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">
                    <i class="bi bi-plus-circle"></i> Savol qo'shish
                </h4>
                <span class="badge bg-primary fs-6">
                    <i class="bi bi-question-circle"></i> {{ exam.questions|length }} ta savol
                </span>
            </div>
            <div class="card p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Savol matni</label>
                        <textarea name="text" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                <span class="badge bg-light text-dark border">A</span> variant
                            </label>
                            <input type="text" name="option_a" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                <span class="badge bg-light text-dark border">B</span> variant
                            </label>
                            <input type="text" name="option_b" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                <span class="badge bg-light text-dark border">C</span> variant
                            </label>
                            <input type="text" name="option_c" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                <span class="badge bg-light text-dark border">D</span> variant
                            </label>
                            <input type="text" name="option_d" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">To'g'ri javob</label>
                        <select name="correct" class="form-select">
                            <option value="a">A</option>
                            <option value="b">B</option>
                            <option value="c">C</option>
                            <option value="d">D</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit"
                                name="action"
                                value="next"
                                class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="bi bi-plus-lg"></i> Yana savol
                        </button>
                        <button type="submit"
                                name="action"
                                value="finish"
                                class="btn btn-success w-100 py-2 fw-bold">
                            <i class="bi bi-check-lg"></i> Tugatish
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
