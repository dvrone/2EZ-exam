{% extends 'base.html' %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h4 class="mb-4 fw-bold">
                <i class="bi bi-pencil"></i> Testni tahrirlash
            </h4>
            <div class="card p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Test nomi</label>
                        <input type="text"
                               name="title"
                               class="form-control"
                               value="{{ exam.title }}"
                               required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tavsif</label>
                        <textarea name="description" class="form-control" rows="3">{{ exam.description or '' }}</textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Davomiyligi (daqiqada)</label>
                        <input type="number"
                               name="duration"
                               class="form-control"
                               value="{{ exam.duration }}"
                               min="5">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="bi bi-save"></i> Saqlash
                        </button>
                        <a href="{{ url_for('exam.exam_detail', exam_id=exam.id) }}"
                           class="btn btn-outline-secondary w-100">
                            <i class="bi bi-x-lg"></i> Bekor qilish
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
