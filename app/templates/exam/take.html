{% extends 'base.html' %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-7">
            <!-- Savollar va timer ma'lumotlari -->
            <script id="questionsData" type="application/json">
        [
          {% for q in questions %}
            {
              "id": {{ q.id }},
              "text": {{ q.text | tojson }},
              "options": [
                { "value": "a", "text": {{ q.option_a | tojson }} },
                { "value": "b", "text": {{ q.option_b | tojson }} },
                { "value": "c", "text": {{ q.option_c | tojson }} },
                { "value": "d", "text": {{ q.option_d | tojson }} }
              ],
              "correct": {{ q.correct | tojson }}
            }{% if not loop.last %},{% endif %}
          {% endfor %}
        ]
            </script>
            <script id="timerData" type="application/json">{{ exam.duration }}</script>
            <!-- Progress bar -->
            <div class="d-flex align-items-center gap-3 mb-4">
                <a href="{{ url_for("exam.list_exams") }}"
                   class="text-muted text-decoration-none fs-5">
                    <i class="bi bi-x-lg"></i>
                </a>
                <div class="progress flex-grow-1"
                     style="height: 12px;
                            border-radius: 10px">
                    <div class="progress-bar progress-bar-custom"
                         id="progressBar"
                         style="width: 0%"></div>
                </div>
                <span class="badge bg-warning text-dark fs-6">
                    <i class="bi bi-clock"></i> <span id="timer">{{ exam.duration }}:00</span>
                </span>
            </div>
            <!-- Savol kartasi -->
            <div id="questionCard" class="card p-4 mb-4" style="min-height: 300px;">
                <p class="text-muted small mb-2">
                    Savol <span id="currentNum">1</span> / {{ questions | length }}
                </p>
                <h4 id="questionText" class="fw-bold mb-4"></h4>
                <div id="optionsContainer" class="d-flex flex-column gap-3"></div>
            </div>
            <!-- Davom etish tugmasi -->
            <button id="continueBtn"
                    class="btn btn-primary w-100 py-3 fw-bold d-none"
                    style="border-radius: 14px;
                           font-size: 1.1rem">
                Davom etish <i class="bi bi-arrow-right"></i>
            </button>
        </div>
    </div>
    <!-- Yakunlash formasi -->
    <form id="submitForm"
          method="POST"
          action="{{ url_for('exam.submit_exam', exam_id=exam.id) }}">
    </form>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/take.js') }}"></script>{% endblock %}
