{% extends 'base.html' %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-7">
            <h4 class="mb-4 fw-bold">
                <i class="bi bi-pencil"></i> Savolni tahrirlash
            </h4>
            <div class="card p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Savol matni</label>
                        <textarea name="text" class="form-control" rows="3" required>{{ question.text }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                <span class="badge bg-light text-dark border">A</span> variant
                            </label>
                            <input type="text"
                                   name="option_a"
                                   class="form-control"
                                   value="{{ question.option_a }}"
                                   required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                <span class="badge bg-light text-dark border">B</span> variant
                            </label>
                            <input type="text"
                                   name="option_b"
                                   class="form-control"
                                   value="{{ question.option_b }}"
                                   required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                <span class="badge bg-light text-dark border">C</span> variant
                            </label>
                            <input type="text"
                                   name="option_c"
                                   class="form-control"
                                   value="{{ question.option_c }}"
                                   required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                <span class="badge bg-light text-dark border">D</span> variant
                            </label>
                            <input type="text"
                                   name="option_d"
                                   class="form-control"
                                   value="{{ question.option_d }}"
                                   required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">To'g'ri javob</label>
                        <select name="correct" class="form-select">
                            {% for opt in ['a', 'b', 'c', 'd'] %}
                                <option value="{{ opt }}" {% if question.correct == opt %}selected{% endif %}>{{ opt|upper }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="bi bi-save"></i> Saqlash
                        </button>
                        <a href="{{ url_for('exam.exam_detail', exam_id=question.exam_id) }}"
                           class="btn btn-outline-secondary w-100">
                            <i class="bi bi-x-lg"></i> Bekor qilish
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
