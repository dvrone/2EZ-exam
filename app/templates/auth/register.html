{% extends 'base.html' %}
{% block title %}Ro'yxatdan o'tish{% endblock %}
{% block content %}
  <div class="row justify-content-center mt-5">
    <div class="col-md-5">
      <div class="card border-0 shadow-sm p-4">
        <h3 class="mb-4 text-center fw-bold">
          <i class="bi bi-person-plus"></i> Ro'yxatdan o'tish
        </h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   pattern="[a-zA-Z0-9_]{3,20}"
                   title="Faqat harflar, raqamlar va _ belgisi. 3-20 ta belgi."
                   required>
            <div class="form-text text-muted">
              <i class="bi bi-info-circle"></i>
              3-20 ta belgi. Faqat harflar, raqamlar va _ belgisi.
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Parol</label>
            <input type="password" name="password" class="form-control" minlength="6" required>
            <div class="form-text text-muted">
              <i class="bi bi-info-circle"></i>
              Kamida 6 ta belgi.
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-person-check"></i> Ro'yxatdan o'tish
          </button>
        </form>
        <p class="mt-3 text-center">
          Hisobingiz bormi?
          <a href="{{ url_for("auth.login") }}">Kirish</a>
        </p>
      </div>
    </div>
  </div>
  <div class="mb-5"></div>
{% endblock %}
