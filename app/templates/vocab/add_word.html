{% extends 'base.html' %}
{% block title %}So'z qo'shish{% endblock %}
{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">
            <i class="bi bi-plus-circle text-primary"></i> So'z qo'shish
        </h3>
        <span class="badge bg-primary fs-6">
            <i class="bi bi-card-text"></i> {{ vocab_set.words|length }} ta so'z
        </span>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-translate"></i> Inglizcha so'z
                        </label>
                        <input type="text"
                               name="word"
                               class="form-control"
                               placeholder="Apple"
                               required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-chat-text"></i> O'zbekcha tarjima
                        </label>
                        <input type="text"
                               name="translation"
                               class="form-control"
                               placeholder="Olma"
                               required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-text-paragraph"></i> Misol jumla
                            <span class="text-muted fw-normal">(ixtiyoriy)</span>
                        </label>
                        <textarea name="example"
                                  class="form-control"
                                  rows="2"
                                  placeholder="I eat an apple every day."></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit"
                                name="action"
                                value="next"
                                class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="bi bi-plus-lg"></i> Yana so'z
                        </button>
                        <button type="submit"
                                name="action"
                                value="finish"
                                class="btn btn-success w-100 py-2 fw-bold">
                            <i class="bi bi-check-lg"></i> Tugatish
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="mb-5"></div>
{% endblock %}
