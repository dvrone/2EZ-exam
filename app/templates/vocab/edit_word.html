{% extends 'base.html' %}
{% block title %}So'zni tahrirlash{% endblock %}
{% block content %}

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0">
      <i class="bi bi-pencil text-primary"></i> So'zni tahrirlash
    </h3>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">
              <i class="bi bi-translate"></i> Inglizcha so'z
            </label>
            <input type="text" name="word" class="form-control" value="{{ word.word }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">
              <i class="bi bi-chat-text"></i> O'zbekcha tarjima
            </label>
            <input type="text"
                   name="translation"
                   class="form-control"
                   value="{{ word.translation }}"
                   required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">
              <i class="bi bi-tag"></i> Turkum
              <span class="text-muted fw-normal">(ixtiyoriy)</span>
            </label>
            <select name="category" class="form-select">
              <option value="">— Tanlanmagan —</option>
              {% for value, label in categories %}
                <option value="{{ value }}" {% if word.category == value %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">
              <i class="bi bi-text-paragraph"></i> Misol jumla
              <span class="text-muted fw-normal">(ixtiyoriy)</span>
            </label>
            <textarea name="example" class="form-control" rows="2">{{ word.example or '' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
              <i class="bi bi-save"></i> Saqlash
            </button>
            <a href="{{ url_for('vocab.detail_set', set_id=word.set_id) }}"
               class="btn btn-outline-secondary w-100">
              <i class="bi bi-x-lg"></i> Bekor qilish
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="mb-5"></div>
{% endblock %}
