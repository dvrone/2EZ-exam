{% extends 'base_fullscreen.html' %}
{% block title %}Yozish — {{ vocab_set.title }}{% endblock %}
{% block content %}

  <script id="wordsData" type="application/json">
  [
    {% for word in words %}
    {
      "id": {{ word.id }},
      "word": {{ word.word | tojson }},
      "translation": {{ word.translation | tojson }}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  ]
  </script>

  <div class="row justify-content-center">
    <div class="col-md-6">

      <!-- Top bar -->
      <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{{ url_for('vocab.detail_set', set_id=vocab_set.id) }}"
           class="text-muted text-decoration-none fs-5">
          <i class="bi bi-x-lg"></i>
        </a>
        <div class="progress flex-grow-1" style="height: 12px; border-radius: 10px;">
          <div class="progress-bar progress-bar-custom" id="progressBar" style="width: 0%;"></div>
        </div>
        <span class="text-muted small">
          <span id="currentNum">1</span> / {{ words|length }}
        </span>
      </div>

      <!-- Karta -->
      <div id="wordCard" class="card border-0 shadow-sm p-5 text-center mb-4">

        <p class="text-muted small mb-2">Inglizcha tarjimasini yozing</p>
        <h2 class="fw-bold mb-4" id="translationText"></h2>

        <!-- Input -->
        <div class="mb-3">
          <input type="text"
                 id="answerInput"
                 class="form-control form-control-lg text-center"
                 placeholder="Inglizcha so'z..."
                 autocomplete="off"
                 autocorrect="off"
                 autocapitalize="off"
                 spellcheck="false"
                 style="border-radius: 14px;
                        font-size: 1.2rem">
        </div>

        <!-- Hint -->
        <div id="hintSection">
          <button onclick="showHint()" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-lightbulb"></i> Yordam
          </button>
          <p class="text-muted small mt-2" id="hintText"></p>
        </div>

        <!-- Natija -->
        <div id="resultSection" class="d-none mt-3">
          <div id="resultIcon" style="font-size: 2rem;" class="mb-1"></div>
          <p class="fw-bold mb-1" id="resultText"></p>
          <p class="text-muted small" id="correctAnswer"></p>
        </div>

      </div>

      <!-- Tekshirish tugmasi -->
      <button id="checkBtn"
              class="btn btn-primary w-100 py-3 fw-bold mb-3"
              style="border-radius: 14px;
                     font-size: 1.1rem"
              onclick="checkAnswer()">
        <i class="bi bi-check-lg"></i> Tekshirish
      </button>

      <!-- Davom etish tugmasi -->
      <button id="continueBtn"
              class="btn btn-primary w-100 py-3 fw-bold d-none"
              style="border-radius: 14px;
                     font-size: 1.1rem"
              onclick="nextWord()">
        Davom etish <i class="bi bi-arrow-right"></i>
      </button>

      <!-- Yakuniy natija -->
      <div id="finalResult" class="d-none text-center">
        <div class="card border-0 shadow-sm p-5">
          <i class="bi bi-keyboard text-primary" style="font-size: 4rem;"></i>
          <h3 class="fw-bold mt-3">Bajarildi!</h3>
          <p class="text-muted">
            <span class="text-success fw-bold" id="correctCount">0</span> ta to'g'ri /
            <span class="text-danger fw-bold" id="wrongCount">0</span> ta noto'g'ri
          </p>
          <div class="d-flex gap-3 mt-3">
            <button onclick="restartTyping()" class="btn btn-primary w-100 py-2 fw-bold">
              <i class="bi bi-arrow-repeat"></i> Qayta
            </button>
            <a href="{{ url_for('vocab.detail_set', set_id=vocab_set.id) }}"
               class="btn btn-outline-secondary w-100 py-2 fw-bold">
              <i class="bi bi-arrow-left"></i> Orqaga
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="mb-5"></div>
{% endblock %}

{% block scripts %}<script src="{{ url_for('static', filename='js/typing.js') }}"></script>{% endblock %}
